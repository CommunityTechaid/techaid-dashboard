name: Deploy to Production SWA

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push the deploy tag
      issues: write     # needed to apply status labels

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate version.ts
        run: |
          VERSION=$(node -p "require('./package.json').version")
          COMMIT=${GITHUB_SHA::7}
          DATE=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
          BUILD=$(date -u +%y.%m.%d-%H%M)
          echo "export const APP_VERSION = {version: '$VERSION', build: '$BUILD', date: '$DATE', commit: '$COMMIT'};" > src/environments/version.ts

      - name: Inject runtime env
        run: |
          cat > src/assets/env.js << 'EOF'
          window.__env = window.__env || {};
          EOF
          echo "window.__env.appInsightsConnectionString = \"$APPINSIGHTS_CS\";" >> src/assets/env.js
        env:
          APPINSIGHTS_CS: ${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING_PROD }}

      - name: Build
        run: npx ng build --configuration production

      - name: Deploy to Azure Static Web Apps
        id: swa_deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PROD }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true

      - name: Tag deployment
        run: |
          TAG="deploy/prod/$(date -u +%Y-%m-%d)-${GITHUB_SHA::7}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: Label linked issues as shipped
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            // Find the previous prod deploy tag to bound the commit range
            const tags = execSync('git tag --list "deploy/prod/*" --sort=-creatordate')
              .toString().trim().split('\n').filter(Boolean);
            const prevTag = tags[0] || null; // most recent existing tag (new one not pushed yet)
            const range = prevTag ? `${prevTag}..HEAD` : 'HEAD~50..HEAD';
            const commits = execSync(`git log ${range} --format=%H`)
              .toString().trim().split('\n').filter(Boolean);
            console.log(`Scanning ${commits.length} commits since ${prevTag || 'beginning'}`);
            const seen = new Set();
            for (const sha of commits) {
              let prs;
              try {
                const res = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  owner: context.repo.owner, repo: context.repo.repo, commit_sha: sha,
                });
                prs = res.data;
              } catch { continue; }
              for (const pr of prs.filter(p => p.merged_at && p.base.ref === 'dev')) {
                if (seen.has(pr.number)) continue;
                seen.add(pr.number);
                const refs = [...(pr.body || '').matchAll(/(?:fixes|closes|resolves)\s+#(\d+)/gi)];
                for (const [, num] of refs) {
                  console.log(`PR #${pr.number} → issue #${num}: status: shipped`);
                  await github.rest.issues.addLabels({
                    owner: context.repo.owner, repo: context.repo.repo,
                    issue_number: parseInt(num), labels: ['status: shipped'],
                  });
                  try {
                    await github.rest.issues.removeLabel({
                      owner: context.repo.owner, repo: context.repo.repo,
                      issue_number: parseInt(num), name: 'status: in-uat',
                    });
                  } catch { /* label may not be present */ }
                }
              }
            }

      - name: Fast-forward master to deployed commit
        run: |
          # HEAD is the dev commit just deployed to prod. A plain push
          # (no --force) only succeeds if master is strictly behind, so
          # this preserves the "master never diverges from dev" rule.
          # If this step fails, master needs manual investigation — the
          # prod deploy itself has already succeeded.
          git push origin HEAD:refs/heads/master
