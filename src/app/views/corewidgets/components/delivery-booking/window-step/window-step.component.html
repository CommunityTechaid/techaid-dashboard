<div class="step">
  <div class="intro">
    Our driver will arrive at any point during the window — someone must be home for the whole window.
  </div>

  @for (window of availableWindows; track window.id) {
    <div class="window-row" (click)="windowSelected.emit(window.id)">
      <div class="window-row__icon">{{ window.icon }}</div>
      <div class="window-row__text">
        <div class="window-row__name">{{ window.name }}</div>
        <div class="window-row__time">{{ window.startTime }} – {{ window.endTime }}</div>
      </div>
    </div>
  }

  <div class="back-link" (click)="back.emit()">‹ Choose a different day</div>
</div>
