name: Deploy to Dev SWA

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push the deploy tag
      issues: write     # needed to apply status labels

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          # Always build `dev`, never the ref the run was triggered on. The push
          # trigger only ever fires on dev, but this workflow is ALSO
          # workflow_dispatch-able, and that dropdown defaults to the repo's
          # default branch (master) — without this pin, "re-run the UAT deploy"
          # from the Actions UI would build and deploy master to UAT.
          # Deployments are always dev-based.
          ref: dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Generate version.ts
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # Read the sha from the checkout, not $GITHUB_SHA — the checkout above
          # is pinned to dev, so on a workflow_dispatch from any other ref the
          # two disagree and the app would report a commit it wasn't built from.
          COMMIT=$(git rev-parse --short=7 HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
          BUILD=$(date -u +%y.%m.%d-%H%M)
          echo "deployed_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Stamping $VERSION build $BUILD from $COMMIT"
          echo "export const APP_VERSION = {version: '$VERSION', build: '$BUILD', date: '$DATE', commit: '$COMMIT'};" > src/environments/version.ts

      - name: Inject runtime env
        run: |
          cat > src/assets/env.js << 'EOF'
          window.__env = window.__env || {};
          EOF
          echo "window.__env.appInsightsConnectionString = \"$APPINSIGHTS_CS\";" >> src/assets/env.js
        env:
          APPINSIGHTS_CS: ${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING_DEV }}

      - name: Build
        run: npx ng build --configuration uat

      - name: Deploy to Azure Static Web Apps
        id: swa_deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DEV }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true

      - name: Promote linked issues to "In UAT" (label + project board)
        continue-on-error: true   # board sync must never fail the deploy
        uses: actions/github-script@v7
        env:
          # The commit actually built and deployed — not context.sha, which is
          # the trigger ref and diverges from the checkout on workflow_dispatch.
          DEPLOYED_SHA: ${{ steps.version.outputs.deployed_sha }}
        with:
          # PROJECTS_PAT: classic PAT (project + repo scopes). The built-in
          # GITHUB_TOKEN cannot write org-level Projects v2, so a PAT is required.
          github-token: ${{ secrets.PROJECTS_PAT }}
          script: |
            // "TaDa Kanban" (project #2) Status single-select — see workflow docs.
            const PROJECT_ID = 'PVT_kwDOB1-IbM4BZvoG';
            const STATUS_FIELD = 'PVTSSF_lADOB1-IbM4BZvoGzhUsLjg';
            const OPTION_IN_UAT = '47fc9ee4';
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: process.env.DEPLOYED_SHA,
            });
            const mergedPRs = prs.filter(pr => pr.merged_at && pr.base.ref === 'dev');
            for (const pr of mergedPRs) {
              const refs = [...(pr.body || '').matchAll(/(?:fixes|closes|resolves)\s+#(\d+)/gi)];
              for (const [, num] of refs) {
                const issue_number = parseInt(num);
                console.log(`PR #${pr.number} → issue #${issue_number}: In UAT`);
                // 1) Labels (kept as a parallel, filterable signal)
                await github.rest.issues.addLabels({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number, labels: ['status: in-uat'],
                });
                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner, repo: context.repo.repo,
                    issue_number, name: 'status: backlog',
                  });
                } catch { /* label may not be present */ }
                // 2) Project board Status field → In UAT
                const { data: issue } = await github.rest.issues.get({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number,
                });
                const added = await github.graphql(
                  `mutation($p:ID!,$c:ID!){addProjectV2ItemById(input:{projectId:$p,contentId:$c}){item{id}}}`,
                  { p: PROJECT_ID, c: issue.node_id });
                await github.graphql(
                  `mutation($p:ID!,$i:ID!,$f:ID!,$o:String!){updateProjectV2ItemFieldValue(input:{projectId:$p,itemId:$i,fieldId:$f,value:{singleSelectOptionId:$o}}){projectV2Item{id}}}`,
                  { p: PROJECT_ID, i: added.addProjectV2ItemById.item.id, f: STATUS_FIELD, o: OPTION_IN_UAT });
              }
            }

      - name: Tag deployment
        run: |
          # Same reason as the version.ts step: name the tag after the commit
          # that was checked out and deployed, not the ref that triggered the run.
          TAG="deploy/dev/$(date -u +%Y-%m-%d)-$(git rev-parse --short=7 HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
