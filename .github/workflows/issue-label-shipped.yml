name: Label Issues as Shipped

# Runs after a successful production deployment.
# Finds all PRs merged to dev since the previous prod deploy tag and labels
# their linked issues as "status: shipped", removing "status: in-uat".

on:
  workflow_run:
    workflows: ["Deploy to Production SWA"]
    types: [completed]

jobs:
  label-shipped:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Label linked issues as shipped
        uses: actions/github-script@v7
        with:
          script: |
            // Find the previous prod deploy tag to bound the commit range
            const { execSync } = require('child_process');

            let prevTag;
            try {
              // List deploy/prod/* tags sorted by version, take the second-to-last
              // (the last one was just created by the deploy workflow)
              const tags = execSync('git tag --list "deploy/prod/*" --sort=-creatordate')
                .toString().trim().split('\n').filter(Boolean);
              // tags[0] is the tag just pushed; tags[1] is the previous one
              prevTag = tags[1] || null;
            } catch {
              prevTag = null;
            }

            // Collect commits on dev since prevTag (or all if no prior tag)
            let commits;
            try {
              const range = prevTag ? `${prevTag}..HEAD` : 'HEAD~50..HEAD';
              commits = execSync(`git log ${range} --format=%H`).toString().trim().split('\n').filter(Boolean);
            } catch {
              commits = [];
            }

            console.log(`Scanning ${commits.length} commits for linked PRs`);

            const seen = new Set();
            for (const sha of commits) {
              let prs;
              try {
                const res = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  commit_sha: sha,
                });
                prs = res.data;
              } catch {
                continue;
              }

              for (const pr of prs.filter(p => p.merged_at && p.base.ref === 'dev')) {
                if (seen.has(pr.number)) continue;
                seen.add(pr.number);

                const body = pr.body || '';
                const refs = [...body.matchAll(/(?:fixes|closes|resolves)\s+#(\d+)/gi)];
                const issueNumbers = [...new Set(refs.map(m => parseInt(m[1])))];

                for (const num of issueNumbers) {
                  console.log(`Marking issue #${num} as shipped (via PR #${pr.number})`);
                  await github.rest.issues.addLabels({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: num,
                    labels: ['status: shipped'],
                  });
                  for (const stale of ['status: in-uat', 'status: in-development']) {
                    try {
                      await github.rest.issues.removeLabel({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: num,
                        name: stale,
                      });
                    } catch { /* label may not be present */ }
                  }
                }
              }
            }
