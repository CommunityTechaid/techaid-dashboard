<!-- Content Row -->
<div class="row">

    <!-- Content Column -->
    <div class="col-lg-12 mb-4">
        <!-- Project Card Example -->
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="#" [routerLink]="['/dashboard/roles']">Roles</a></li>
                <li class="breadcrumb-item"><a href="#" [routerLink]="['/dashboard/users']">Users</a></li>
                <li class="breadcrumb-item active" aria-current="page">{{ userName() }}</li>
            </ol>
        </nav>

        <ul ngbNav #nav="ngbNav" class="nav-tabs">
            <li ngbNavItem>
        <a ngbNavLink>Roles</a>
                    <ng-template ngbNavContent>
                        <div class="mt-1">
                            <user-roles [userId]="userId()"></user-roles>
                        </div>
                    </ng-template>
            </li>
            <li ngbNavItem>
        <a ngbNavLink>Permissions</a>
                <ng-template ngbNavContent>
                    <div class="mt-1">
                        <user-permissions [userId]="userId()"></user-permissions>
                    </div>
                </ng-template>
            </li>
        </ul>
<div [ngbNavOutlet]="nav"></div>
    </div>
</div>
