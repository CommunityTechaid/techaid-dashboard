<!-- Content Row -->
<div class="row">

  <!-- Content Column -->
  <div class="col-lg-12 mb-4">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="#" [routerLink]="['/dashboard/users']">Users</a></li>
        <li class="breadcrumb-item active" aria-current="page">Roles</li>
      </ol>
    </nav>
    <!-- Project Card Example -->
    <div class="card shadow mb-4">
      <div class="card-body">
        <div class="w-100">
          <div class="table-responsive">
            <cta-table tableId="role-index" pagingType="full_numbers" [columns]="columns" [source]="source"
              [order]="{ column: 0, dir: 'desc' }" (loadError)="onLoadError($event)">
              <ng-template ctaRow let-dt>
                <tr [class.selected]="selections[dt.id]" (click)="select(dt)">
                  <td>
                    <a href="#" [routerLink]="['./', dt.id]">{{ dt.name }}</a>
                  </td>
                  <td>
                    <div class="d-flex">
                      <div>{{ dt.description }}</div>
                      <div class="ms-4">
                        <div ngbDropdown placement="bottom-left" class="d-inline-block mb-2">
                          <button class="btn btn-sm btn-outline-link" id="options" ngbDropdownToggle>
                            <i class="fas fa-cogs"></i>
                          </button>
                          <div ngbDropdownMenu aria-labelledby="options">
                            <a href="#" [routerLink]="['./', dt.id]" class="dropdown-item">
                              View Details
                            </a>
                          </div>
                        </div>
                      </div>
                    </div>
                  </td>
                </tr>
              </ng-template>
            </cta-table>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
