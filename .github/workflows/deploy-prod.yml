name: Deploy to Production SWA

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push the deploy tag
      issues: write     # needed to apply status labels

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # npm install, not npm ci: the Windows-maintained lockfile lacks some
        # platform-optional entries, so npm ci rejects it on Linux ("Missing:
        # @emnapi/core from lock file"). ci.yml and deploy-dev.yml already use
        # npm install for the same reason; this workflow was missed, which broke
        # every production deploy after the lockfile drifted. Revisit if the
        # lock is regenerated cross-platform.
        run: npm install

      - name: Generate version.ts
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # Read the sha from the checkout, NOT $GITHUB_SHA. On workflow_dispatch
          # $GITHUB_SHA is the sha of the ref the run was dispatched from (the
          # default branch), while the checkout step above explicitly pulls `dev`.
          # Because the final step fast-forwards master to each deployed commit,
          # the dispatch ref is always the PREVIOUS deploy — so the app reported
          # the last release's commit, every time.
          COMMIT=$(git rev-parse --short=7 HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
          BUILD=$(date -u +%y.%m.%d-%H%M)
          echo "export const APP_VERSION = {version: '$VERSION', build: '$BUILD', date: '$DATE', commit: '$COMMIT'};" > src/environments/version.ts

      - name: Inject runtime env
        run: |
          cat > src/assets/env.js << 'EOF'
          window.__env = window.__env || {};
          EOF
          echo "window.__env.appInsightsConnectionString = \"$APPINSIGHTS_CS\";" >> src/assets/env.js
        env:
          APPINSIGHTS_CS: ${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING_PROD }}

      - name: Build
        run: npx ng build --configuration production

      - name: Deploy to Azure Static Web Apps
        id: swa_deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PROD }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true

      - name: Tag deployment
        id: tag_deployment
        run: |
          # Capture the PREVIOUS prod deploy tag before creating the new one, and
          # hand it to the labelling step below as an output. That step cannot work
          # it out for itself once this step has run: the tag created here points at
          # HEAD, so it sorts first and the range collapses to `<tag-at-HEAD>..HEAD`
          # — zero commits, silently, on every deploy. Passing it explicitly means
          # the dependency survives any future reordering of these steps.
          PREV_TAG=$(git tag --list "deploy/prod/*" --sort=-creatordate | head -n 1)
          echo "prev_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
          echo "Previous prod deploy tag: ${PREV_TAG:-<none>}"
          # Same reason as the version.ts step: name the tag after the commit that
          # was actually checked out and deployed, not the dispatch ref. Before this
          # fix the tag NAME lagged one release behind the commit it pointed AT —
          # e.g. deploy/prod/2026-08-12-dff9ab4 pointing at 9ecb6ad.
          TAG="deploy/prod/$(date -u +%Y-%m-%d)-$(git rev-parse --short=7 HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Label linked issues as shipped
        continue-on-error: true   # board sync must never block the master fast-forward
        uses: actions/github-script@v7
        env:
          # Read before the new deploy tag existed — see the Tag deployment step.
          PREV_DEPLOY_TAG: ${{ steps.tag_deployment.outputs.prev_tag }}
        with:
          # PROJECTS_PAT: classic PAT (project + repo scopes). The built-in
          # GITHUB_TOKEN cannot write org-level Projects v2, so a PAT is required.
          github-token: ${{ secrets.PROJECTS_PAT }}
          script: |
            const { execSync } = require('child_process');
            // "TaDa Kanban" (project #2) Status single-select — see workflow docs.
            const PROJECT_ID = 'PVT_kwDOB1-IbM4BZvoG';
            const STATUS_FIELD = 'PVTSSF_lADOB1-IbM4BZvoGzhUsLjg';
            const OPTION_ON_LIVE_SITE = '98236657';
            // Previous prod deploy tag, captured by the Tag deployment step BEFORE
            // it created this deploy's tag. Do not recompute it here — see there.
            const prevTag = process.env.PREV_DEPLOY_TAG || null;
            const range = prevTag ? `${prevTag}..HEAD` : 'HEAD~50..HEAD';
            const commits = execSync(`git log ${range} --format=%H`)
              .toString().trim().split('\n').filter(Boolean);
            console.log(`Scanning ${commits.length} commits since ${prevTag || 'beginning'}`);
            if (commits.length === 0) {
              // The whole point of this step is to move issues to "On Live Site".
              // Scanning nothing means it silently did nothing, which is how the
              // previous ordering bug went unnoticed — say so loudly instead.
              core.warning(`No commits in range ${range} — no issues will be labelled shipped.`);
            }
            const seen = new Set();
            for (const sha of commits) {
              let prs;
              try {
                const res = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  owner: context.repo.owner, repo: context.repo.repo, commit_sha: sha,
                });
                prs = res.data;
              } catch { continue; }
              for (const pr of prs.filter(p => p.merged_at && p.base.ref === 'dev')) {
                if (seen.has(pr.number)) continue;
                seen.add(pr.number);
                const refs = [...(pr.body || '').matchAll(/(?:fixes|closes|resolves)\s+#(\d+)/gi)];
                for (const [, num] of refs) {
                  const issue_number = parseInt(num);
                  console.log(`PR #${pr.number} → issue #${issue_number}: status: shipped`);
                  // 1) Labels (kept as a parallel, filterable signal)
                  await github.rest.issues.addLabels({
                    owner: context.repo.owner, repo: context.repo.repo,
                    issue_number, labels: ['status: shipped'],
                  });
                  try {
                    await github.rest.issues.removeLabel({
                      owner: context.repo.owner, repo: context.repo.repo,
                      issue_number, name: 'status: in-uat',
                    });
                  } catch { /* label may not be present */ }
                  // 2) Project board Status field → On Live Site
                  const { data: issue } = await github.rest.issues.get({
                    owner: context.repo.owner, repo: context.repo.repo, issue_number,
                  });
                  const added = await github.graphql(
                    `mutation($p:ID!,$c:ID!){addProjectV2ItemById(input:{projectId:$p,contentId:$c}){item{id}}}`,
                    { p: PROJECT_ID, c: issue.node_id });
                  await github.graphql(
                    `mutation($p:ID!,$i:ID!,$f:ID!,$o:String!){updateProjectV2ItemFieldValue(input:{projectId:$p,itemId:$i,fieldId:$f,value:{singleSelectOptionId:$o}}){projectV2Item{id}}}`,
                    { p: PROJECT_ID, i: added.addProjectV2ItemById.item.id, f: STATUS_FIELD, o: OPTION_ON_LIVE_SITE });
                }
              }
            }

      - name: Fast-forward master to deployed commit
        run: |
          # HEAD is the dev commit just deployed to prod. A plain push
          # (no --force) only succeeds if master is strictly behind, so
          # this preserves the "master never diverges from dev" rule.
          # If this step fails, master needs manual investigation — the
          # prod deploy itself has already succeeded.
          git push origin HEAD:refs/heads/master
