<!-- Content Row -->
<div class="row">
  <!-- Content Column -->
  <div class="col-lg-12 mb-4">
    <!-- Project Card Example -->
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="#" [routerLink]="['/dashboard']">Dashboard</a></li>
        <li class="breadcrumb-item active" aria-current="page">Admin Panel</li>
      </ol>
    </nav>

    <ul class="nav nav-tabs mb-3">
      <li class="nav-item">
        <a class="nav-link" [class.active]="activeTab === 'availability'" href="#"
           (click)="selectTab('availability'); $event.preventDefault()">Device Availability</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" [class.active]="activeTab === 'flags'" href="#"
           (click)="selectTab('flags'); $event.preventDefault()">Feature Flags</a>
      </li>
    </ul>

    <!-- Device Availability tab. Rendered with @if rather than [hidden] like its neighbour:
         it holds staged, unsaved edits, and [hidden] would keep a half-edited matrix alive
         (and its "3 unsaved changes" counter running) behind whichever tab the admin moved to.

         This absorbed the old Application Configuration tab. Those six switches were the ceiling
         for everything in the matrix — a device off globally could not be offered by any borough —
         but on a separate tab that relationship was invisible, and switching a borough on while
         the global switch was off did nothing with no explanation. They are now the top row. -->
    @if (activeTab === 'availability') {
      <app-borough-availability></app-borough-availability>
    }

    <!-- Feature Flags tab -->
    <div [hidden]="activeTab !== 'flags'">
      <app-feature-flags></app-feature-flags>
    </div>
  </div>
</div>
