name: CI

# Gate for dev: lint, production build, and the fully-mocked e2e subset.
#
# The e2e job needs NO secrets: the @mocked specs stub every GraphQL call via
# page.route, and auth0-spa-js never verifies the signature of cached tokens,
# so a self-minted JWT satisfies the SDK. Specs that need live UAT data are
# excluded here (they self-skip or fail without a real bearer token) — they
# run locally pre-merge per docs/digital-hygiene-remediation.md.
#
# Runs on push to dev as well as on PRs. PR-only was not enough: #147 merged
# with a red lint job, which then failed on dev and made every later PR inherit
# a red gate its author had not caused (#148). A post-merge run makes a broken
# dev visible on dev itself rather than in the next person's PR.

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job only checks out, installs, builds and tests (artifact upload needs no token scope).
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (errors gate; warnings are the documented legacy baseline)
        run: npx eslint . --quiet

      - name: FontAwesome subset coverage
        run: npm run fa:check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npx ng build --configuration production

  e2e-mocked:
    runs-on: ubuntu-latest
    # Run inside Microsoft's Playwright image: Chromium and its system libraries are already in it,
    # so the job no longer depends on the Ubuntu apt mirrors (`playwright install --with-deps` failed
    # on 2026-11-11 when the runners could not resolve security.ubuntu.com / azure.archive.ubuntu.com).
    # The tag MUST match @playwright/test in package-lock.json; the first step below enforces it.
    # When Dependabot bumps @playwright/test, bump this tag in the same PR.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    env:
      PLAYWRIGHT_IMAGE_VERSION: '1.65.0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Playwright image matches the locked @playwright/test
        run: |
          LOCKED=$(node -p "require('./node_modules/@playwright/test/package.json').version")
          if [ "$LOCKED" != "$PLAYWRIGHT_IMAGE_VERSION" ]; then
            echo "::error::@playwright/test is $LOCKED but the CI container is v$PLAYWRIGHT_IMAGE_VERSION. Bump the image tag and PLAYWRIGHT_IMAGE_VERSION in .github/workflows/ci.yml."
            exit 1
          fi

      - name: Mint fake token for the mocked subset
        # Fake credentials, real format: the SDK only checks structure and
        # expiry of cached tokens, and all GraphQL is page.route-stubbed. The token
        # carries the STAFF permission set (e2e/helpers/staff-permissions.json).
        run: |
          TOKEN=$(node e2e/mint-fake-token.mjs)
          E2E_BEARER_TOKEN="$TOKEN" node e2e/save-token.mjs

      - name: Run mocked e2e subset
        run: npm run e2e:fast

      - name: Skip hygiene — summary and >40% ceiling
        # Runs even when tests fail so the summary still lands; its own exit
        # code only reflects the skip ratio, never masks the test result.
        if: always()
        run: node e2e/check-skips.mjs test-results/results.json

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
